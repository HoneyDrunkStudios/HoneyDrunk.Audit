name: API Compatibility

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/HoneyDrunk.Audit.Abstractions/**'
      - '.github/workflows/api-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-compatibility:
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-api-compatibility.yml@678aa08e4242b665e40b32a97833f969bc083af0
    with:
      dotnet-version: '11.0.100'
      project-path: './src/HoneyDrunk.Audit.Abstractions/HoneyDrunk.Audit.Abstractions.csproj'
      actions-ref: '678aa08e4242b665e40b32a97833f969bc083af0'
