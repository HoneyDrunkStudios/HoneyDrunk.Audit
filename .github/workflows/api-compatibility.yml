name: API Compatibility

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/HoneyDrunk.Audit.Abstractions/**'
      - '.github/workflows/api-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-compatibility:
    uses: HoneyDrunkStudios/HoneyDrunk.Actions/.github/workflows/job-api-compatibility.yml@de51d34c6f2f6db2346275b6582c8863521a68ed
    with:
      dotnet-version: '11.0.100'
      project-path: './src/HoneyDrunk.Audit.Abstractions/HoneyDrunk.Audit.Abstractions.csproj'
      actions-ref: 'de51d34c6f2f6db2346275b6582c8863521a68ed'
